[project]
name = "mystack-dev"
version = "0.1.1"
description = "Development workspace for Mystack"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "awswrangler==3.17.0",
  "boto3==1.43.66",
  "httpx>=0.28,<0.29",
  "playwright>=1.54,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.11,<0.12",
]

[tool.uv.workspace]
members = ["shared", "proxy", "emr", "glue"]

[tool.uv.sources]
mystack-aws-protocol = { workspace = true }
mystack-proxy = { workspace = true }
mystack-emr = { workspace = true }
mystack-glue = { workspace = true }

[tool.pytest.ini_options]
# Official import-path configuration: https://docs.pytest.org/en/stable/reference/reference.html#confval-pythonpath
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["shared/tests", "proxy/tests", "emr/tests", "glue/tests", "tests"]
asyncio_mode = "auto"
timeout = 60
timeout_method = "thread"
markers = [
  "browser: browser-driven console and accessibility contract",
  "contract: boto3 or wire-level protocol contract test",
  "e2e: Docker and real runtime end-to-end test",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["glue/src/mystack/glue/application/partition_expression/generated/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
