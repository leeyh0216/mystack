# Private ECR, immutable tags, and least-privilege GitHub OIDC role.
# Official references:
# https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws
# https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html
# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ecr-repository.html
AWSTemplateFormatVersion: "2010-09-09"
Description: Mystack private ECR repositories and GitHub Actions release role

Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com provider ARN; blank creates one.
  GitHubSubjectPrefix:
    Type: String
    Description: >-
      Repository OIDC prefix returned by GitHub, for example
      repo:OWNER@OWNER_ID/REPOSITORY@REPOSITORY_ID for immutable subjects.
  GitHubEnvironment:
    Type: String
    Default: ecr-production
  ProxyRepositoryName:
    Type: String
    Default: mystack-proxy
  EmrRepositoryName:
    Type: String
    Default: mystack-emr
  GlueRepositoryName:
    Type: String
    Default: mystack-glue

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: mystack

  ProxyRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ProxyRepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after 14 days",
          "selection":{"tagStatus":"untagged","countType":"sinceImagePushed",
          "countUnit":"days","countNumber":14},"action":{"type":"expire"}},
          {"rulePriority":2,"description":"Keep the newest 50 tagged releases",
          "selection":{"tagStatus":"tagged","tagPrefixList":["v","manual","rollback"],
          "countType":"imageCountMoreThan","countNumber":50},"action":{"type":"expire"}}]}

  EmrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EmrRepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after 14 days",
          "selection":{"tagStatus":"untagged","countType":"sinceImagePushed",
          "countUnit":"days","countNumber":14},"action":{"type":"expire"}},
          {"rulePriority":2,"description":"Keep the newest 50 tagged releases",
          "selection":{"tagStatus":"tagged","tagPrefixList":["v","manual","rollback"],
          "countType":"imageCountMoreThan","countNumber":50},"action":{"type":"expire"}}]}

  GlueRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref GlueRepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after 14 days",
          "selection":{"tagStatus":"untagged","countType":"sinceImagePushed",
          "countUnit":"days","countNumber":14},"action":{"type":"expire"}},
          {"rulePriority":2,"description":"Keep the newest 50 tagged releases",
          "selection":{"tagStatus":"tagged","tagPrefixList":["v","manual","rollback"],
          "countType":"imageCountMoreThan","countNumber":50},"action":{"type":"expire"}}]}

  GitHubReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Short-lived GitHub OIDC role for Mystack ECR releases
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub >-
                  ${GitHubSubjectPrefix}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: MystackEcrRelease
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PublishVerifyScanAndRollback
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:StartImageScan
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt ProxyRepository.Arn
                  - !GetAtt EmrRepository.Arn
                  - !GetAtt GlueRepository.Arn
      Tags:
        - Key: Project
          Value: mystack

Outputs:
  GitHubReleaseRoleArn:
    Value: !GetAtt GitHubReleaseRole.Arn
  Registry:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}
  ProxyRepositoryUri:
    Value: !GetAtt ProxyRepository.RepositoryUri
  EmrRepositoryUri:
    Value: !GetAtt EmrRepository.RepositoryUri
  GlueRepositoryUri:
    Value: !GetAtt GlueRepository.RepositoryUri
