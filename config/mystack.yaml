# Schema and mount behavior are documented in:
# https://docs.docker.com/reference/compose-file/configs/
schema_version: 1

logging:
  level: INFO
  format: json

management:
  console:
    # Polling complements explicit refresh; streaming log transport is configured separately.
    # Timer behavior: https://html.spec.whatwg.org/multipage/timers-and-user-prompts.html#timers
    refresh_interval_seconds: 2
    # Reconnect-safe SSE is produced by the Proxy from bounded EMR log chunks.
    # Protocol: https://html.spec.whatwg.org/multipage/server-sent-events.html
    log_stream_poll_interval_seconds: 0.5
    log_stream_timeout_seconds: 300
    log_buffer_bytes: 1048576
  diagnostics:
    enabled: true
    stack_limit: 100

proxy:
  listen:
    host: 0.0.0.0
    port: 8080
  fallback_url: http://localstack:4566
  request_timeout_seconds: 300
  routes:
    - name: emr
      backend_url: http://emr:8080
      target_prefixes: [ElasticMapReduce]
      signing_names: [elasticmapreduce]
      host_prefixes: [elasticmapreduce, emr]
    - name: glue
      backend_url: http://glue:8080
      target_prefixes: [AWSGlue]
      signing_names: [glue]
      host_prefixes: [glue]

localstack:
  endpoint_url: http://localstack:4566
  region: us-east-1
  account_id: "000000000000"
  access_key_id: test
  secret_access_key: test
  s3_path_style: true

emr:
  listen:
    host: 0.0.0.0
    port: 8080
  work_root: /var/lib/mystack/emr
  process_timeout_seconds: 3600
  bootstrap_timeout_seconds: 900
  bootstrap_shell: /bin/bash
  terminate_grace_seconds: 10
  shutdown_timeout_seconds: 30
  output_tail_bytes: 32768
  live_log_chunk_bytes: 16384
  # Local journals older than this are retained unless publication is complete.
  log_retention_seconds: 604800
  log_publication:
    max_attempts: 3
    initial_backoff_seconds: 0.5
    max_backoff_seconds: 10
    attempt_timeout_seconds: 60
  # Optional separate file; relative paths resolve beside this main configuration file.
  # Shape source: https://docs.aws.amazon.com/emr/latest/APIReference/API_RunJobFlow.html
  startup_clusters_file: null
  command_runner_jars: [command-runner.jar]
  api_page_size: 50
  max_active_steps: 256
  default_release_label: emr-7.8.0
  release_profiles:
    emr-7.8.0:
      runtime_profile: spark-3.5.4
      aws_spark_version: 3.5.4-amzn-0
      source: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-release-app-versions-7.x.html

glue:
  listen:
    host: 0.0.0.0
    port: 8080
  data_root: /var/lib/mystack/glue
  state_file: catalog-state.json
  catalog_id: "000000000000"
  api_page_size: 100
  create_default_database: true
  # GetPartitions Expression is limited to 2048 characters by the Glue API model.
  # Source: https://docs.aws.amazon.com/glue/latest/webapi/API_GetPartitions.html
  partition_expressions:
    max_length: 2048
    max_tokens: 512
    supported_key_types:
      - string
      - date
      - timestamp
      - int
      - bigint
      - long
      - tinyint
      - smallint
      - decimal
  runtime_profile: glue-5.0

runtime_profiles:
  spark-3.5.4:
    spark_version: 3.5.4
    python_version: "3.11"
    java_version: "17"
    master: local[*]
    spark_submit: /opt/spark/bin/spark-submit
    submit_aliases: [spark-submit]
    spark_packages:
      - org.apache.hadoop:hadoop-aws:3.3.4
    spark_conf:
      spark.ui.enabled: "false"
      spark.driver.bindAddress: 127.0.0.1
      spark.driver.host: 127.0.0.1
    # Options that consume the next token, used to locate the application resource.
    # Source: https://spark.apache.org/docs/3.5.4/submitting-applications.html
    option_value_names:
      - --archives
      - --class
      - --conf
      - --deploy-mode
      - --driver-class-path
      - --driver-java-options
      - --driver-library-path
      - --driver-memory
      - --executor-cores
      - --executor-memory
      - --files
      - --jars
      - --keytab
      - --kill
      - --master
      - --name
      - --packages
      - --packages-exclude
      - --principal
      - --properties-file
      - --proxy-user
      - --py-files
      - --queue
      - --repositories
      - --status
      - --total-executor-cores
  glue-5.0:
    base_image: public.ecr.aws/glue/aws-glue-libs:5
    spark_version: 3.5.4
    python_version: "3.11"
    java_version: "17"
    iceberg_version: 1.7.1

tests:
  unit_timeout_seconds: 60
  contract_timeout_seconds: 120
  package_smoke_timeout_seconds: 120
  e2e_timeout_seconds: 1200
  compose_wait_timeout_seconds: 300
  e2e:
    endpoint_url: http://127.0.0.1:4566
    poll_interval_seconds: 0.5
    sdk_connect_timeout_seconds: 5
    sdk_read_timeout_seconds: 30
    sdk_max_attempts: 3
    browser_action_timeout_seconds: 30
    browser_required_environment_variable: MYSTACK_BROWSER_E2E_REQUIRED
    compose_file: compose.yaml
    emr_service: emr
    emr_jar_fixture_container_path: /opt/mystack/spark-s3-job.jar
    emr_release_label: emr-7.8.0
    emr_expected_spark_version_prefix: 3.5.4
    glue_service: glue
    glue_spark_submit: spark-submit
    glue_catalog_script: /opt/mystack/e2e/glue_catalog_job.py
    glue_expected_spark_version_prefix: 3.5.4
    glue_catalog_endpoint_url: http://proxy:8080
    object_store_endpoint_url: http://localstack:4566
    sts_endpoint_url: http://localstack:4566
    artifacts_dir: test-artifacts
