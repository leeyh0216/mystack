# Local hooks avoid a second dependency resolver and run from the uv lock.
# Official configuration reference: https://pre-commit.com/#pre-commit-configyaml---top-level
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-lint
        name: React TypeScript ESLint
        entry: npm run frontend:lint
        language: system
        pass_filenames: false
        files: ^(ui|emr/ui|glue/ui)/|^(package(-lock)?\.json|eslint\.config\.js|tsconfig\.json)$
      - id: documentation-contract
        name: Bilingual documentation contract
        entry: uv run python scripts/check_docs.py
        language: system
        pass_filenames: false
        always_run: true
      - id: glue-expression-grammar
        name: Glue ANTLR grammar generated-source drift
        entry: make antlr-check
        language: system
        pass_filenames: false
        files: ^(glue/grammar/|glue/src/mystack/glue/application/partition_expression/generated/|tools/antlr/|scripts/generate_glue_expression_parser\.py$)
      - id: devcontainer-contract
        name: Reproducible Dev Container contract
        entry: make devcontainer-check
        language: system
        pass_filenames: false
        always_run: true
      - id: ghcr-compose-contract
        name: Published-image Compose user contract
        entry: make ghcr-compose-check
        language: system
        pass_filenames: false
        always_run: true
      - id: requirement-locks
        name: Container requirement lock drift
        entry: uv run python scripts/export_requirements.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: aws-model-manifest
        name: AWS service-model drift
        entry: uv run python scripts/model_manifest.py --check contracts/service-model-manifest.json
        language: system
        pass_filenames: false
        always_run: true
      - id: compatibility-matrix
        name: Manifest-driven interoperability matrix drift
        entry: uv run python scripts/compatibility_matrix.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: glue-error-contracts
        name: Deterministic Glue error contract drift
        entry: make glue-errors-check
        language: system
        pass_filenames: false
        always_run: true
      - id: api-coverage
        name: Complete API classification and generated matrix drift
        entry: uv run python scripts/api_coverage.py --check contracts/api-coverage.json --english docs/compatibility/api-coverage.generated.md --korean docs/compatibility/api-coverage.ko.generated.md
        language: system
        pass_filenames: false
        always_run: true
      - id: registry-release-contract
        name: File-driven GHCR release contract
        entry: uv run pytest tests/test_registry_release.py --timeout 60 --timeout-method thread -q
        language: system
        pass_filenames: false
        always_run: true
      - id: version-authority
        name: Stable version authority and derived-file drift
        entry: uv run python scripts/version.py check
        language: system
        pass_filenames: false
        always_run: true
      - id: github-rulesets
        name: File-driven main and develop repository rulesets
        entry: uv run python scripts/github_rulesets.py check
        language: system
        pass_filenames: false
        always_run: true
