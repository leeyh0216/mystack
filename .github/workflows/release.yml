# Human/event-facing release entrypoint. Registry mutation is delegated to the reusable workflow.
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
name: Release GHCR images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      component:
        description: Component to publish
        required: true
        type: choice
        options: [all, proxy, emr, glue]
        default: all
      version:
        description: Optional new tag; blank generates a unique manual tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, preflight, authorize, and publish
    permissions:
      contents: read
      # A called workflow cannot elevate the caller's token. Its non-publish jobs explicitly
      # downgrade to contents:read; only its final publish job retains this ceiling.
      packages: write
    uses: ./.github/workflows/container-publish.yml
    with:
      event_name: ${{ github.event_name }}
      component: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'all' }}
      requested_version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      ref_name: ${{ github.ref_name }}
