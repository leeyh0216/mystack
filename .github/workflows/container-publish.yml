# File-driven contract and runbook:
# config/registry-release.json and docs/container-release.md
# Official GHCR publication contract:
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images
name: Publish GHCR images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      component:
        description: Component to publish
        required: true
        type: choice
        options: [all, proxy, emr, glue]
        default: all
      version:
        description: Optional new tag; blank generates a unique manual tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  required-compatibility:
    name: Required compatibility before publication
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install and validate generated compatibility evidence
        run: |
          uv sync --locked --all-packages
          make compatibility-check
      - name: Run required contract cases as isolated processes
        run: |
          set -euo pipefail
          jq -r '.github_matrices.required_contract.include[].case_id' \
            contracts/compatibility-matrix.generated.json | while IFS= read -r case_id; do
              uv run python scripts/run_compatibility_case.py "$case_id"
            done
      - name: Build and start Mystack
        run: make up
      - name: Run required Docker cases as isolated processes
        run: |
          set -euo pipefail
          jq -r '.github_matrices.required_e2e.include[].case_id' \
            contracts/compatibility-matrix.generated.json | while IFS= read -r case_id; do
              uv run python scripts/run_compatibility_case.py "$case_id"
            done
      - name: Collect component logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-compatibility-diagnostics
          path: |
            docker-compose.log
            test-artifacts/
          if-no-files-found: ignore
      - name: Stop Mystack
        if: always()
        run: docker compose down --volumes --remove-orphans

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      platforms: ${{ steps.release.outputs.platforms }}
      registry: ${{ steps.release.outputs.registry }}
      version: ${{ steps.release.outputs.version }}
      trivy_version: ${{ steps.release.outputs.trivy_version }}
      scan_timeout: ${{ steps.release.outputs.scan_timeout }}
      scan_severities: ${{ steps.release.outputs.scan_severities }}
      ignore_unfixed: ${{ steps.release.outputs.ignore_unfixed }}
      workflow_timeout_minutes: ${{ steps.release.outputs.workflow_timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        name: Validate file-driven publication request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'all' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          config=config/registry-release.json
          python3 scripts/registry_release.py --config "$config" check-config
          if [ "$REQUESTED_COMPONENT" = all ]; then
            matrix=$(jq -c '{include: .components}' "$config")
          else
            matrix=$(jq -c --arg name "$REQUESTED_COMPONENT" \
              '{include: [.components[] | select(.name == $name)]}' "$config")
            test "$(jq '.include | length' <<<"$matrix")" -eq 1
          fi
          version="$REQUESTED_VERSION"
          if [ "$EVENT_NAME" = push ]; then
            version="$GITHUB_REF_NAME"
            release_pattern=$(jq -r '.tags.release_pattern' "$config")
            if ! jq -en --arg value "$version" --arg pattern "$release_pattern" \
              '$value | test($pattern)' >/dev/null; then
              echo "Tag release does not match configured pattern: $version" >&2
              exit 2
            fi
          elif [ -z "$version" ]; then
            prefix=$(jq -r '.tags.manual_prefix' "$config")
            version="${prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          if ! grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$' <<<"$version"; then
            echo "Invalid OCI image tag: $version" >&2
            exit 2
          fi
          {
            echo "matrix=$matrix"
            echo "platforms=$(jq -r '.platforms | join(",")' "$config")"
            echo "registry=$(jq -r '.registry' "$config")"
            echo "version=$version"
            echo "trivy_version=$(jq -r '.scan.trivy_version' "$config")"
            echo "scan_timeout=$(jq -r '.scan.timeout' "$config")"
            echo "scan_severities=$(jq -r '.scan.fail_severities | join(",")' "$config")"
            echo "ignore_unfixed=$(jq -r '.scan.ignore_unfixed' "$config")"
            echo "workflow_timeout_minutes=$(jq -r '.workflow_timeout_minutes' "$config")"
          } >>"$GITHUB_OUTPUT"

  publish:
    needs: [prepare, required-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.workflow_timeout_minutes) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Official GHCR login pattern: https://github.com/docker/login-action#github-container-registry
      - name: Authenticate to GHCR with the ephemeral workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ needs.prepare.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: identity
        name: Resolve package identity and reject an existing tag
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image="$REGISTRY/$owner/${{ matrix.package }}"
          echo "event=registry.tag.check.before image=$image tag=$VERSION"
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            echo "event=registry.tag.check.failed image=$image tag=$VERSION fix_hint=choose-a-new-tag" >&2
            exit 2
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "event=registry.tag.check.after image=$image tag=$VERSION available=true"
      - id: build
        name: Build and publish the multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ needs.prepare.outputs.platforms }}
          pull: true
          push: true
          tags: ${{ steps.identity.outputs.image }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
      - name: Capture and verify the published OCI image index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          echo "event=registry.index.fetch.before image=$IMAGE digest=$DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" \
            >"release-artifacts/index.json"
          python3 scripts/registry_release.py verify-index \
            --component "${{ matrix.name }}" \
            --image "$IMAGE" \
            --tag "$VERSION" \
            --digest "$DIGEST" \
            --manifest release-artifacts/index.json \
            --report release-artifacts/release.json
      - name: Install the pinned vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ needs.prepare.outputs.trivy_version }}
          cache: true
      - name: Scan every runtime platform and enforce the file policy
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.identity.outputs.image }}
          IGNORE_UNFIXED: ${{ needs.prepare.outputs.ignore_unfixed }}
          SCAN_TIMEOUT: ${{ needs.prepare.outputs.scan_timeout }}
        run: |
          set -euo pipefail
          scan_args=()
          while IFS= read -r platform; do
            safe_platform=${platform//\//-}
            report="release-artifacts/trivy-${safe_platform}.json"
            command=(trivy image --scanners vuln --format json --output "$report" \
              --platform "$platform" --timeout "$SCAN_TIMEOUT" --exit-code 0)
            if [ "$IGNORE_UNFIXED" = true ]; then
              command+=(--ignore-unfixed)
            fi
            echo "event=registry.scan.before image=$IMAGE digest=$DIGEST platform=$platform"
            "${command[@]}" "$IMAGE@$DIGEST"
            echo "event=registry.scan.after image=$IMAGE digest=$DIGEST platform=$platform"
            scan_args+=(--scan "$platform=$report")
          done < <(jq -r '.platforms[]' config/registry-release.json)
          python3 scripts/registry_release.py evaluate-scans \
            "${scan_args[@]}" \
            --report release-artifacts/scan-summary.json
      - name: Upload digest, manifest, SBOM/provenance context, and scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-${{ matrix.name }}-${{ needs.prepare.outputs.version }}
          path: release-artifacts/
          if-no-files-found: warn
