# Reusable-only publication pipeline. Trigger ownership lives in release.yml.
# Official reusable-workflow and permission contracts:
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#permissions
name: Reusable GHCR publication

on:
  workflow_call:
    inputs:
      channel:
        description: stable or snapshot publication channel
        required: true
        type: string
      version:
        description: Exact immutable OCI tag derived by scripts/release/release_policy.py
        required: true
        type: string
      python_version:
        description: PEP 440 rendering derived from the same stable authority
        required: true
        type: string
      source_sha:
        description: Exact successful CI SHA to build and publish
        required: true
        type: string
      ci_run_id:
        description: Successful CI run that produced reusable prerequisite artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Validate and resolve the release plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      component_matrix: ${{ steps.release.outputs.component_matrix }}
      preflight_matrix: ${{ steps.release.outputs.preflight_matrix }}
      platforms: ${{ steps.release.outputs.platforms }}
      registry: ${{ steps.release.outputs.registry }}
      selection: ${{ steps.release.outputs.selection }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      python_version: ${{ steps.release.outputs.python_version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      snapshot_retention_days: ${{ steps.release.outputs.snapshot_retention_days }}
      trivy_version: ${{ steps.release.outputs.trivy_version }}
      scan_timeout: ${{ steps.release.outputs.scan_timeout }}
      ignore_unfixed: ${{ steps.release.outputs.ignore_unfixed }}
      workflow_timeout_minutes: ${{ steps.release.outputs.workflow_timeout_minutes }}
      preflight_timeout_minutes: ${{ steps.release.outputs.preflight_timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - id: release
        name: Resolve a file-driven, non-mutating release plan
        env:
          CHANNEL: ${{ inputs.channel }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          config=config/registry-release.json
          python3 scripts/registry_release.py --config "$config" check-config
          python3 scripts/release/version.py check
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          grep -Eq '^[0-9a-f]{40}$' <<<"$SOURCE_SHA"
          test "$CHANNEL" = stable -o "$CHANNEL" = snapshot
          pattern=$(jq -r --arg channel "$CHANNEL" \
            'if $channel == "stable" then .tags.stable_pattern else .tags.snapshot_pattern end' \
            "$config")
          jq -en --arg value "$VERSION" --arg pattern "$pattern" \
            '$value | test($pattern)' >/dev/null
          stable=$(tr -d '\n' <VERSION)
          case "$CHANNEL" in
            stable)
              test "$VERSION" = "v$stable"
              test "$PYTHON_VERSION" = "$stable"
              ;;
            snapshot)
              [[ "$VERSION" == "v$stable-snapshot."* ]]
              [[ "$PYTHON_VERSION" == "$stable.dev"*"+g"* ]]
              ;;
          esac
          publication_plan=$(python3 scripts/registry_release.py --config "$config" resolve-plan)
          component_matrix=$(jq -c '.component_matrix' <<<"$publication_plan")
          preflight_matrix=$(jq -c '.preflight_matrix' <<<"$publication_plan")

          echo "event=registry.plan.resolve.after channel=$CHANNEL version=$VERSION python_version=$PYTHON_VERSION source_sha=$SOURCE_SHA components=$(jq '.include | length' <<<"$component_matrix")"
          {
            echo "component_matrix=$component_matrix"
            echo "preflight_matrix=$preflight_matrix"
            echo "platforms=$(jq -r '.platforms' <<<"$publication_plan")"
            echo "registry=$(jq -r '.registry' <<<"$publication_plan")"
            echo "selection=$(jq -r '.selection' <<<"$publication_plan")"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "python_version=$PYTHON_VERSION"
            echo "source_sha=$SOURCE_SHA"
            echo "snapshot_retention_days=$(jq -r '.snapshot_retention_days' <<<"$publication_plan")"
            echo "trivy_version=$(jq -r '.trivy_version' <<<"$publication_plan")"
            echo "scan_timeout=$(jq -r '.scan_timeout' <<<"$publication_plan")"
            echo "ignore_unfixed=$(jq -r '.ignore_unfixed' <<<"$publication_plan")"
            echo "workflow_timeout_minutes=$(jq -r '.workflow_timeout_minutes' <<<"$publication_plan")"
            echo "preflight_timeout_minutes=$(jq -r '.preflight_timeout_minutes' <<<"$publication_plan")"
          } >>"$GITHUB_OUTPUT"

  required-validation:
    name: Required repository and interoperability validation
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      # Official setup-node cache contract: https://github.com/actions/setup-node
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - id: reusable_ui
        name: Download UI build from the authorized CI run
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: service-ui-builds-${{ inputs.source_sha }}
          path: .
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded UI build provenance
        if: steps.reusable_ui.outcome == 'success'
        run: >-
          python3 scripts/reusable_build_artifact.py verify
          --manifest .mystack/reusable-ui/manifest.json
          --source-sha "${{ inputs.source_sha }}"
          --platform "$RUNNER_OS-$RUNNER_ARCH"
          --input package-lock.json --input package.json --input .node-version
          --artifact emr/src/mystack/emr/static/ui
          --artifact glue/src/mystack/glue/static/ui
      - name: Rebuild UI after unavailable CI artifact
        if: steps.reusable_ui.outcome != 'success'
        run: |
          echo '{"event":"reusable_ui.fallback","reason":"artifact-unavailable"}'
          npm ci --ignore-scripts
          npm run frontend:build
      - name: Install and run repository-local required checks
        run: |
          uv sync --locked --all-packages
          npm ci --ignore-scripts
          uv run pre-commit run --all-files
          npm run frontend:typecheck
          npm run frontend:test
          make test package-check compatibility-check compatibility-evidence-check
      - name: Run required contract cases as isolated processes
        run: |
          set -euo pipefail
          jq -r '.github_matrices.required_contract.include[].case_id' \
            contracts/compatibility-evidence.generated.json | while IFS= read -r case_id; do
              uv run python scripts/compatibility/run_compatibility_case.py "$case_id"
            done
      - name: Build and start Mystack for required Docker cases
        run: make up
      - name: Run required Docker cases as isolated processes
        run: |
          set -euo pipefail
          jq -r '.github_matrices.required_e2e.include[].case_id' \
            contracts/compatibility-evidence.generated.json | while IFS= read -r case_id; do
              uv run python scripts/compatibility/run_compatibility_case.py "$case_id"
            done
      - name: Collect component logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log || true
      - name: Preserve release-blocking acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: required-validation-evidence
          path: |
            contracts/compatibility-matrix.generated.json
            contracts/compatibility-evidence.generated.json
            contracts/api-coverage.generated.json
            contracts/glue-error-conditions.yaml
            docs/compatibility/release-acceptance.generated.md
            docs/compatibility/release-acceptance.ko.generated.md
            docs/compatibility/api-coverage.generated.md
            docs/compatibility/api-coverage.ko.generated.md
            docs/compatibility/annotated-evidence.generated.md
            docs/compatibility/annotated-evidence.ko.generated.md
            docs/compatibility/glue-errors.generated.md
            docs/compatibility/glue-errors.ko.generated.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-validation-failure-diagnostics
          path: |
            docker-compose.log
            test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Mystack
        if: always()
        run: docker compose down --volumes --remove-orphans

  local-build-scan:
    name: Preflight ${{ matrix.name }} ${{ matrix.platform }}
    needs: [prepare, required-validation]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.preflight_timeout_minutes) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.preflight_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: build
        name: Build one platform into the local Docker engine without registry mutation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          push: false
          tags: mystack-preflight-${{ matrix.name }}:${{ matrix.platform_slug }}-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            io.mystack.preflight.platform=${{ matrix.platform }}
          cache-from: type=gha,scope=preflight-${{ matrix.name }}-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=preflight-${{ matrix.name }}-${{ matrix.platform_slug }}
          provenance: false
          sbom: false
      - name: Verify the source-built Glue SQLite runtime on this architecture
        if: matrix.name == 'glue'
        env:
          IMAGE_NAME: mystack-preflight-${{ matrix.name }}:${{ matrix.platform_slug }}-${{ inputs.source_sha }}
          PREFLIGHT_TIMEOUT_MINUTES: ${{ needs.prepare.outputs.preflight_timeout_minutes }}
        run: |
          set -euo pipefail
          directory="release-artifacts/preflight/${{ matrix.name }}/${{ matrix.platform_slug }}"
          mkdir -p "$directory"
          python3 scripts/verify_glue_sqlite_runtime.py \
            --image "$IMAGE_NAME" \
            --platform "${{ matrix.platform }}" \
            --timeout-seconds "$((PREFLIGHT_TIMEOUT_MINUTES * 60))" \
            --report "$directory/sqlite-runtime.json"
      - name: Install the pinned vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ needs.prepare.outputs.trivy_version }}
          cache: true
      - name: Scan the local image and enforce the configured policy
        env:
          IGNORE_UNFIXED: ${{ needs.prepare.outputs.ignore_unfixed }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          IMAGE_NAME: mystack-preflight-${{ matrix.name }}:${{ matrix.platform_slug }}-${{ inputs.source_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SCAN_TIMEOUT: ${{ needs.prepare.outputs.scan_timeout }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          directory="release-artifacts/preflight/${{ matrix.name }}/${{ matrix.platform_slug }}"
          mkdir -p "$directory"
          command=(trivy image --scanners vuln --format json --output "$directory/trivy.json" \
            --timeout "$SCAN_TIMEOUT" --exit-code 0)
          if [ "$IGNORE_UNFIXED" = true ]; then
            command+=(--ignore-unfixed)
          fi
          echo "event=registry.preflight.scan.before component=${{ matrix.name }} platform=${{ matrix.platform }} image_id=$IMAGE_ID"
          "${command[@]}" "$IMAGE_NAME"
          python3 scripts/registry_release.py record-preflight \
            --component "${{ matrix.name }}" \
            --platform "${{ matrix.platform }}" \
            --image-id "$IMAGE_ID" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --scan "$directory/trivy.json" \
            --report "$directory/preflight.json"
          echo "event=registry.preflight.scan.after component=${{ matrix.name }} platform=${{ matrix.platform }} image_id=$IMAGE_ID"
      - name: Upload local build and scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-${{ matrix.name }}-${{ matrix.platform_slug }}
          path: release-artifacts/
          if-no-files-found: warn

  aggregate-gate:
    name: Authorize registry publication
    needs: [prepare, required-validation, local-build-scan]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download every successful preflight record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: preflight-*
          path: preflight-evidence
          merge-multiple: true
      - name: Reject missing, extra, mismatched, or modified evidence
        env:
          SELECTION: ${{ needs.prepare.outputs.selection }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/registry_release.py verify-gate \
            --evidence-root preflight-evidence \
            --selection "$SELECTION" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --report release-gate/gate.json
      - name: Upload the publication authorization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-authorization
          path: release-gate/gate.json
          if-no-files-found: error

  ensure-stable-tag:
    name: Bind the stable annotated tag to the validated SHA
    needs: [prepare, aggregate-gate]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Recheck stable uniqueness and create or resume the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/version.py check \
            --require-unreleased \
            --github-repository "$GITHUB_REPOSITORY" \
            --allow-existing-at-sha "$SOURCE_SHA"
          python3 -m scripts.release.github_release \
            --repository "$GITHUB_REPOSITORY" \
            --timeout-seconds 30 \
            ensure-tag --tag "$VERSION" --sha "$SOURCE_SHA"

  publish:
    name: Publish ${{ matrix.name }} only after authorization
    needs: [prepare, aggregate-gate, ensure-stable-tag]
    if: >-
      always() &&
      needs.aggregate-gate.result == 'success' &&
      (needs.ensure-stable-tag.result == 'success' || needs.ensure-stable-tag.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.workflow_timeout_minutes) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.component_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download the aggregate authorization only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publication-authorization
          path: release-gate
      - id: authorization
        name: Bind authorization to this source, version, and component selection
        env:
          SELECTION: ${{ needs.prepare.outputs.selection }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          result=$(python3 scripts/registry_release.py authorize-publication \
            --gate release-gate/gate.json \
            --selection "$SELECTION" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION")
          echo "sha256=$(jq -r '.authorization_sha256' <<<"$result")" >>"$GITHUB_OUTPUT"
      - name: Authenticate to GHCR with the ephemeral workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ needs.prepare.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: identity
        name: Resolve package identity and safely resume an existing same-SHA tag
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image="$REGISTRY/$owner/${{ matrix.package }}"
          echo "event=registry.tag.check.before image=$image tag=$VERSION"
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            platform=$(jq -r '.platforms[0]' config/registry-release.json)
            config_json=$(docker buildx imagetools inspect \
              --format "{{json (index .Image \"$platform\")}}" "$image:$VERSION")
            if ! actual_sha=$(jq -er '.config.Labels["org.opencontainers.image.revision"]' \
              <<<"$config_json"); then
              echo "event=registry.tag.check.failed image=$image tag=$VERSION fix_hint=existing-tag-has-no-mystack-revision-label" >&2
              exit 2
            fi
            python3 -m scripts.release.release_policy binding \
              --expected-sha "$SOURCE_SHA" --actual-sha "$actual_sha"
            manifest_json=$(docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "$image:$VERSION")
            digest=$(jq -er '.digest' <<<"$manifest_json")
            test -n "$digest"
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
            echo "event=registry.tag.check.after image=$image tag=$VERSION action=resume digest=$digest"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
            echo "event=registry.tag.check.after image=$image tag=$VERSION action=create"
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
      - name: Log the registry mutation boundary
        if: steps.identity.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          echo "event=registry.image.publish.before image=$IMAGE tag=$VERSION
          source_sha=$SOURCE_SHA side_effect=true"
      - id: build
        name: Build and publish the authorized multi-platform image
        if: steps.identity.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ needs.prepare.outputs.platforms }}
          pull: true
          push: true
          tags: ${{ steps.identity.outputs.image }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            io.mystack.authorization.sha256=${{ steps.authorization.outputs.sha256 }}
            io.mystack.python.version=${{ needs.prepare.outputs.python_version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
      - name: Log the completed image push
        if: steps.identity.outputs.exists != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          echo "event=registry.image.publish.after image=$IMAGE tag=$VERSION
          digest=$DIGEST side_effect=true"
      - name: Capture and verify the published OCI image index
        env:
          CREATED_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.identity.outputs.digest }}
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          DIGEST="${CREATED_DIGEST:-$EXISTING_DIGEST}"
          test -n "$DIGEST"
          echo "event=registry.index.fetch.before image=$IMAGE digest=$DIGEST"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" \
            >"release-artifacts/index.json"
          python3 scripts/registry_release.py verify-index \
            --component "${{ matrix.name }}" \
            --image "$IMAGE" \
            --tag "$VERSION" \
            --digest "$DIGEST" \
            --manifest release-artifacts/index.json \
            --report release-artifacts/release.json
      - name: Upload digest, OCI index, SBOM/provenance context, and authorization
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-${{ matrix.name }}-${{ needs.prepare.outputs.version }}
          path: |
            release-artifacts/
            release-gate/gate.json
          if-no-files-found: warn

  verify-publication:
    name: Verify anonymous public consumption and retain release evidence
    needs: [prepare, publish]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.preflight_timeout_minutes) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Prove every exact tag is anonymously readable, source-bound, and runtime-verified
        env:
          PREFLIGHT_TIMEOUT_MINUTES: ${{ needs.prepare.outputs.preflight_timeout_minutes }}
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          mkdir -p release-evidence
          jq -c '.components[]' config/registry-release.json | while IFS= read -r component; do
            name=$(jq -r '.name' <<<"$component")
            package=$(jq -r '.package' <<<"$component")
            image="$REGISTRY/$owner/$package"
            echo "event=registry.anonymous.verify.before component=$name image=$image tag=$VERSION"
            manifest_json=$(docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "$image:$VERSION")
            digest=$(jq -er '.digest' <<<"$manifest_json")
            docker buildx imagetools inspect --raw "$image:$VERSION" \
              >"release-evidence/$name-index.json"
            jq -r '.platforms[]' config/registry-release.json | while IFS= read -r platform; do
              config_json=$(docker buildx imagetools inspect \
                --format "{{json (index .Image \"$platform\")}}" "$image:$VERSION")
              if ! actual_sha=$(jq -er '.config.Labels["org.opencontainers.image.revision"]' \
                <<<"$config_json"); then
                echo "event=registry.anonymous.verify.failed component=$name platform=$platform fix_hint=inspect-published-oci-labels" >&2
                exit 2
              fi
              python3 -m scripts.release.release_policy binding \
                --expected-sha "$SOURCE_SHA" --actual-sha "$actual_sha"
              if [ "$name" = glue ]; then
                platform_digest=$(jq -er --arg platform "$platform" '
                  [.manifests[]
                  | select(.platform.os + "/" + .platform.architecture == $platform)
                  | .digest]
                  | if length == 1 then .[0] else error("expected one published platform digest") end' \
                  "release-evidence/$name-index.json")
                platform_slug=${platform//\//-}
                directory="release-evidence/$name-$platform_slug"
                mkdir -p "$directory"
                echo "event=registry.anonymous.sqlite_runtime.before image=$image digest=$platform_digest platform=$platform"
                python3 scripts/verify_glue_sqlite_runtime.py \
                  --image "$image@$platform_digest" \
                  --platform "$platform" \
                  --timeout-seconds "$((PREFLIGHT_TIMEOUT_MINUTES * 60))" \
                  --report "$directory/sqlite-runtime.json"
                echo "event=registry.anonymous.sqlite_runtime.after image=$image digest=$platform_digest platform=$platform"
              fi
            done
            python3 scripts/registry_release.py verify-index \
              --component "$name" --image "$image" --tag "$VERSION" --digest "$digest" \
              --manifest "release-evidence/$name-index.json" \
              --report "release-evidence/$name-release.json"
            echo "event=registry.anonymous.verify.after component=$name image=$image tag=$VERSION digest=$digest"
          done
      - name: Emit configured snapshot retention metadata
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          RETENTION_DAYS: ${{ needs.prepare.outputs.snapshot_retention_days }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          jq -n \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson snapshot_retention_days "$RETENTION_DAYS" \
            '{schema_version: 1, channel: $channel, version: $version, source_sha: $source_sha,
              snapshot_retention_days: (if $channel == "snapshot" then $snapshot_retention_days else null end),
              deletion_automated: false}' >release-evidence/retention.json
      - name: Upload anonymous index, SQLite runtime, and retention evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-release-evidence-${{ needs.prepare.outputs.version }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 14

  finalize-stable-release:
    name: Create or resume the GitHub Release after image verification
    needs: [prepare, verify-publication]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - name: Create or resume the release with image and evidence links
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n' \
            "## Container images" \
            "- \`ghcr.io/$owner/mystack-proxy:$VERSION\`" \
            "- \`ghcr.io/$owner/mystack-emr:$VERSION\`" \
            "- \`ghcr.io/$owner/mystack-glue:$VERSION\`" \
            "" \
            "Publication and anonymous-pull evidence: $run_url")
          python3 -m scripts.release.github_release \
            --repository "$GITHUB_REPOSITORY" \
            --timeout-seconds 30 \
            ensure-release --tag "$VERSION" --sha "$SOURCE_SHA" --body "$body"
