# Docker Compose reference: https://docs.docker.com/compose/how-tos/ci-cd/
name: Docker E2E

on:
  pull_request:
    paths:
      - "proxy/**"
      - "shared/**"
      - "emr/**"
      - "glue/**"
      - "ui/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - "tests/e2e/**"
      - "compatibility/**"
      - "contracts/compatibility-matrix.generated.json"
      - "scripts/compatibility_matrix.py"
      - "scripts/run_compatibility_case.py"
      - "scripts/ci_test_report.py"
      - "requirements/**"
      - "config/**"
      - "compose.yaml"
      - "compose.mount-config.yaml"
      - "compose.emr-startup-clusters.yaml"
      - "compose.emr-prestart.yaml"
      - "Makefile"
      - "**/Dockerfile"
      - ".github/workflows/e2e.yml"
      - ".github/actions/publish-test-report/action.yml"
  schedule:
    - cron: "43 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MYSTACK_TEST_REPORT_RETENTION_DAYS: "14"
  MYSTACK_FAILURE_DIAGNOSTIC_RETENTION_DAYS: "7"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-compatibility:
    name: Resolve required Docker compatibility cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contract_matrix: ${{ steps.matrix.outputs.contract_matrix }}
      e2e_matrix: ${{ steps.matrix.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        name: Read the event-selected non-cross-product matrices
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ]; then
            contract_matrix=$(jq -c '{include: ([.github_matrices.required_contract.include[], .github_matrices.nightly_contract.include[]])}' contracts/compatibility-matrix.generated.json)
            e2e_matrix=$(jq -c '{include: ([.github_matrices.required_e2e.include[], .github_matrices.nightly_e2e.include[]])}' contracts/compatibility-matrix.generated.json)
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            contract_matrix=$(jq -c '{include: ([.github_matrices.required_contract.include[], .github_matrices.preview_contract.include[], .github_matrices.nightly_contract.include[]])}' contracts/compatibility-matrix.generated.json)
            e2e_matrix=$(jq -c '{include: ([.github_matrices.required_e2e.include[], .github_matrices.preview_e2e.include[], .github_matrices.nightly_e2e.include[]])}' contracts/compatibility-matrix.generated.json)
          else
            contract_matrix=$(jq -c '.github_matrices.required_contract' contracts/compatibility-matrix.generated.json)
            e2e_matrix=$(jq -c '.github_matrices.required_e2e' contracts/compatibility-matrix.generated.json)
          fi
          test "$(jq '.include | length' <<<"$contract_matrix")" -gt 0
          test "$(jq '.include | length' <<<"$e2e_matrix")" -gt 0
          {
            echo "contract_matrix=$contract_matrix"
            echo "e2e_matrix=$e2e_matrix"
          } >>"$GITHUB_OUTPUT"

  selected-compatibility-contracts:
    name: Selected contract ${{ matrix.case_id }}
    needs: prepare-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-compatibility.outputs.contract_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python_version }}
          enable-cache: true
      - name: Install and validate the locked workspace
        run: |
          uv sync --locked --all-packages
          make compatibility-check
      - name: Run the selected contract case
        run: >-
          uv run python scripts/run_compatibility_case.py "${{ matrix.case_id }}"
          --junitxml "ci-artifacts/selected-contract-${{ matrix.case_id }}/junit.xml"
      - name: Publish selected contract test evidence
        if: always()
        uses: ./.github/actions/publish-test-report
        with:
          artifact-name: selected-contract-${{ matrix.case_id }}-test-report
          junit-files: selected-contract-${{ matrix.case_id }}=ci-artifacts/selected-contract-${{ matrix.case_id }}/junit.xml
          output-dir: ci-artifacts/selected-contract-${{ matrix.case_id }}
          retention-days: ${{ env.MYSTACK_TEST_REPORT_RETENTION_DAYS }}
          title: Selected contract ${{ matrix.case_id }}

  boto-spark-catalog-iceberg:
    name: Compatibility ${{ matrix.case_id }}
    needs: prepare-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-compatibility.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install E2E client dependencies
        run: uv sync --locked --all-packages
      - name: Reject manifest and generated-evidence drift
        run: make compatibility-check
      - name: Build and start Mystack
        run: make up
      - name: Run the explicit case in an isolated process
        run: >-
          uv run python scripts/run_compatibility_case.py "${{ matrix.case_id }}"
          --junitxml "ci-artifacts/e2e-${{ matrix.case_id }}/junit.xml"
      - name: Publish Docker E2E test evidence
        if: always()
        uses: ./.github/actions/publish-test-report
        with:
          artifact-name: e2e-${{ matrix.case_id }}-test-report
          junit-files: e2e-${{ matrix.case_id }}=ci-artifacts/e2e-${{ matrix.case_id }}/junit.xml
          output-dir: ci-artifacts/e2e-${{ matrix.case_id }}
          retention-days: ${{ env.MYSTACK_TEST_REPORT_RETENTION_DAYS }}
          title: Docker E2E ${{ matrix.case_id }}
      - name: Collect component logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log || true
      - name: Collect managed Glue optimizer run logs
        if: failure()
        run: |
          mkdir -p test-artifacts
          docker compose cp glue:/var/lib/mystack/glue/table-optimizer-runs test-artifacts/glue-table-optimizer-runs || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-${{ matrix.case_id }}-failure-diagnostics
          path: |
            docker-compose.log
            test-artifacts/
          if-no-files-found: ignore
          retention-days: ${{ env.MYSTACK_FAILURE_DIAGNOSTIC_RETENTION_DAYS }}
      - name: Stop Mystack
        if: always()
        run: docker compose down --volumes --remove-orphans

  console-accessibility:
    name: Console accessibility E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install the locked workspace and browser
        run: |
          uv sync --locked --all-packages
          uv run playwright install --with-deps chromium
      - name: Build and start Mystack
        env:
          MYSTACK_EMR_STARTUP_CLUSTERS_FILE: ${{ github.workspace }}/tests/e2e/assets/emr-startup-clusters.yaml
          MYSTACK_EMR_PRESTART_SOURCE: ${{ github.workspace }}/tests/e2e/assets/emr-prestart.d
        run: |
          wait_timeout=$(uv run python scripts/config_value.py tests.compose_wait_timeout_seconds)
          docker compose -f compose.yaml \
            -f compose.emr-startup-clusters.yaml \
            -f compose.emr-prestart.yaml \
            up --build --detach --wait --wait-timeout "$wait_timeout"
      - name: Verify startup provisioning and restart semantics
        env:
          MYSTACK_STARTUP_CLUSTER_E2E_REQUIRED: "1"
        run: |
          timeout=$(uv run python scripts/config_value.py tests.e2e_timeout_seconds)
          uv run pytest tests/e2e/test_emr_startup.py -m e2e \
            --timeout "$timeout" --timeout-method thread -vv \
            --junitxml=ci-artifacts/console-e2e/startup-junit.xml
      - name: Verify trusted pre-start, inventory, and PID 1 semantics
        env:
          MYSTACK_PRESTART_E2E_REQUIRED: "1"
        run: |
          timeout=$(uv run python scripts/config_value.py tests.e2e_timeout_seconds)
          uv run pytest tests/e2e/test_emr_prestart.py -m e2e \
            --timeout "$timeout" --timeout-method thread -vv \
            --junitxml=ci-artifacts/console-e2e/prestart-junit.xml
      - name: Run the browser contract with the configured timeout
        env:
          MYSTACK_BROWSER_E2E_REQUIRED: "1"
          MYSTACK_STARTUP_CLUSTER_E2E_REQUIRED: "1"
        run: |
          timeout=$(uv run python scripts/config_value.py tests.e2e_timeout_seconds)
          uv run pytest tests/e2e/test_console_browser.py -m e2e \
            --timeout "$timeout" --timeout-method thread -vv \
            --junitxml=ci-artifacts/console-e2e/browser-junit.xml
      - name: Publish console E2E test evidence
        if: always()
        uses: ./.github/actions/publish-test-report
        with:
          artifact-name: console-e2e-test-report
          junit-files: |
            startup=ci-artifacts/console-e2e/startup-junit.xml
            prestart=ci-artifacts/console-e2e/prestart-junit.xml
            browser=ci-artifacts/console-e2e/browser-junit.xml
          output-dir: ci-artifacts/console-e2e
          retention-days: ${{ env.MYSTACK_TEST_REPORT_RETENTION_DAYS }}
          title: Console accessibility E2E
      - name: Collect component logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: console-e2e-failure-diagnostics
          path: |
            docker-compose.log
            test-artifacts/
          if-no-files-found: ignore
          retention-days: ${{ env.MYSTACK_FAILURE_DIAGNOSTIC_RETENTION_DAYS }}
      - name: Stop Mystack
        if: always()
        run: docker compose down --volumes --remove-orphans
