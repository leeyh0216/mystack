# Docker Compose reference: https://docs.docker.com/compose/how-tos/ci-cd/
name: Docker E2E

on:
  pull_request:
    paths:
      - "proxy/**"
      - "shared/**"
      - "emr/**"
      - "glue/**"
      - "tests/e2e/**"
      - "requirements/**"
      - "config/**"
      - "compose.yaml"
      - "compose.mount-config.yaml"
      - "Makefile"
      - "**/Dockerfile"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "43 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boto-spark-catalog-iceberg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install E2E client dependencies
        run: uv sync --locked --all-packages
      - name: Install the browser used by accessibility E2E
        run: uv run playwright install --with-deps chromium
      - name: Build and start Mystack
        run: make up
      - name: Run boto3 and real runtime E2E tests
        env:
          MYSTACK_BROWSER_E2E_REQUIRED: "1"
        run: make e2e
      - name: Collect component logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-diagnostics
          path: |
            docker-compose.log
            test-artifacts/
          if-no-files-found: ignore
      - name: Stop Mystack
        if: always()
        run: docker compose down --volumes --remove-orphans
