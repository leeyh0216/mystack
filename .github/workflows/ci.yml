# GitHub Actions workflow syntax: https://docs.github.com/actions/writing-workflows
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React TypeScript contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYSTACK_FRONTEND_TEST_TIMEOUT_MS: "10000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Official setup-node cache contract: https://github.com/actions/setup-node
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the locked frontend workspace
        run: npm ci --ignore-scripts
      - name: Lint, type-check, test, and build both service UIs
        run: npm run frontend:check
      - name: Upload service-owned UI builds for Python protocol tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-ui-builds
          path: |
            emr/src/mystack/emr/static/ui
            glue/src/mystack/glue/static/ui
          if-no-files-found: error
          retention-days: 1

  prepare-compatibility:
    name: Resolve required compatibility cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        name: Read the event-selected non-cross-product contract matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            matrix=$(jq -c '{include: ([.github_matrices.required_contract.include[], .github_matrices.preview_contract.include[]])}' contracts/compatibility-matrix.generated.json)
          else
            matrix=$(jq -c '.github_matrices.required_contract' contracts/compatibility-matrix.generated.json)
          fi
          test "$(jq '.include | length' <<<"$matrix")" -gt 0
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  required-compatibility-contracts:
    name: Compatibility ${{ matrix.case_id }}
    needs: prepare-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-compatibility.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python_version }}
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages
      - name: Reject manifest and generated-evidence drift
        run: make compatibility-check
      - name: Run the explicit case in an isolated process
        run: uv run python scripts/run_compatibility_case.py "${{ matrix.case_id }}"

  python-contracts:
    name: Python ${{ matrix.python-version }} contracts
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download service-owned UI builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: service-ui-builds
          path: .
      # Official setup-uv action: https://github.com/astral-sh/setup-uv
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Verify the pinned Glue ANTLR grammar output
        if: matrix.python-version == '3.11'
        run: |
          java -version
          make antlr-check
      - name: Enforce architecture boundaries and mutation contracts
        run: make architecture-check
      - name: Validate bilingual documentation contracts
        run: uv run python scripts/check_docs.py
      - name: Verify hash-locked container requirements
        run: uv run python scripts/export_requirements.py --check
      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          make ghcr-compose-check
          MYSTACK_EMR_PRESTART_SOURCE="$PWD/examples/emr-prestart" \
            docker compose -f compose.yaml -f compose.emr-prestart.yaml config --quiet
          MYSTACK_IMAGE_TAG=v0.0.0 \
          MYSTACK_EMR_PRESTART_SOURCE="$PWD/examples/emr-prestart" \
            docker compose -f compose.ghcr.yaml -f compose.emr-prestart.yaml config --quiet
      - name: Validate file-driven GHCR release contract
        run: uv run python scripts/registry_release.py check-config
      - name: Verify pinned AWS service-model manifest
        run: >-
          uv run python scripts/model_manifest.py
          --check contracts/service-model-manifest.json
          --report model-drift-report.json
      - name: Verify manifest-driven interoperability evidence
        run: uv run python scripts/compatibility_matrix.py --check
      - name: Verify complete API classification and generated bilingual matrix
        run: >-
          uv run python scripts/api_coverage.py
          --check contracts/api-coverage.json
          --english docs/compatibility/api-coverage.generated.md
          --korean docs/compatibility/api-coverage.ko.generated.md
          --report api-coverage-drift-report.json
      - name: Verify contributor pre-commit gates
        env:
          SKIP: frontend-lint
        run: uv run pre-commit run --all-files
      - name: Unit, architecture, and protocol contract tests
        run: >-
          uv run pytest
          -m "not e2e"
          --timeout 60
          --timeout-method thread
          --cov=shared/src
          --cov=proxy/src
          --cov=emr/src
          --cov=glue/src
          --cov-report=term-missing
          --cov-report=xml
      - name: Build and co-install all namespace distributions
        run: make package-check
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python-version }}-diagnostics
          path: |
            coverage.xml
            model-drift-report.json
            api-coverage-drift-report.json
          if-no-files-found: ignore

  devcontainer:
    name: Reproducible Dev Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Validate configuration and image locks
        run: make devcontainer-check devcontainer-verify-images
      # Reference CLI and frozen feature lock:
      # https://github.com/devcontainers/cli#pre-building
      - name: Build with the official Dev Container CLI
        run: >-
          npx --yes @devcontainers/cli@0.88.0 build
          --workspace-folder .
          --frozen-lockfile
