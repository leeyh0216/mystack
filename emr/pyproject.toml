[project]
name = "mystack-emr"
version = "0.1.6"
description = "Protocol-compatible Amazon EMR emulator for Mystack"
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3==1.43.66",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<0.29",
  "mystack-aws-protocol",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
mystack-emr = "mystack.emr.main:run"
mystack-emr-runtime-inventory = "mystack.emr.runtime_inventory:run"
mystack-emr-run-as-hadoop = "mystack.emr.privilege:run"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Namespace package configuration:
# https://docs.astral.sh/uv/concepts/build-backend/#namespace-packages
module-name = "mystack.emr"

[tool.uv.sources]
mystack-aws-protocol = { workspace = true }
