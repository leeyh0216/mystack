[project]
name = "mystack-emr"
version = "0.1.0"
description = "Protocol-compatible Amazon EMR emulator for Mystack"
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3==1.43.66",
  "fastapi>=0.116,<1",
  "mystack-aws-protocol",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
mystack-emr = "mystack_emr.main:run"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
mystack-aws-protocol = { workspace = true }

