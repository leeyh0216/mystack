# Human-owned policy only. Test cases, versions, runtimes and operation coverage are
# collected from typed pytest compatibility annotations.
schema_version: 1

official_sources:
  botocore-models:
    title: botocore AWS service models
    url: https://github.com/boto/botocore/tree/develop/botocore/data
  emr-7.8.0:
    title: Amazon EMR 7.8.0 release
    url: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-780-release.html
  glue-5.0:
    title: AWS Glue 5.0 migration guide
    url: https://docs.aws.amazon.com/glue/latest/dg/migrating-version-50.html
  glue-hive:
    title: AWS Glue Data Catalog as the Spark Hive metastore
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-glue-data-catalog-hive.html
  glue-iceberg:
    title: Using Apache Iceberg with AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-format-iceberg.html
  glue-open-table-format:
    title: AWS Glue Open Table Format CreateTable input
    url: https://docs.aws.amazon.com/glue/latest/webapi/API_OpenTableFormatInput.html
  glue-table-optimizers:
    title: AWS Glue Data Catalog table optimizers
    url: https://docs.aws.amazon.com/glue/latest/dg/table-optimizers.html
  iceberg-evolution:
    title: Apache Iceberg 1.7.1 evolution
    url: https://iceberg.apache.org/docs/1.7.1/evolution/
  iceberg-spark-writes:
    title: Apache Iceberg 1.7.1 Spark writes
    url: https://iceberg.apache.org/docs/1.7.1/spark-writes/
  iceberg-configuration:
    title: Apache Iceberg 1.7.1 configuration
    url: https://iceberg.apache.org/docs/1.7.1/configuration/
  iceberg-spark-queries:
    title: Apache Iceberg 1.7.1 Spark queries
    url: https://iceberg.apache.org/docs/1.7.1/spark-queries/
  iceberg-spark-ddl:
    title: Apache Iceberg 1.7.1 Spark DDL
    url: https://iceberg.apache.org/docs/1.7.1/spark-ddl/
  iceberg-spark-procedures:
    title: Apache Iceberg 1.7.1 Spark procedures
    url: https://iceberg.apache.org/docs/1.7.1/spark-procedures/
  iceberg-branching:
    title: Apache Iceberg 1.7.1 branching and tagging
    url: https://iceberg.apache.org/docs/1.7.1/branching/
  iceberg-glue-catalog-source:
    title: Apache Iceberg 1.7.1 GlueCatalog implementation
    url: https://github.com/apache/iceberg/blob/apache-iceberg-1.7.1/aws/src/main/java/org/apache/iceberg/aws/glue/GlueCatalog.java#L311-L416
  aws-sdk-pandas:
    title: AWS SDK for pandas API
    url: https://aws-sdk-pandas.readthedocs.io/en/stable/api.html

lanes:
  required:
    release_blocking: true
    events: [pull_request, push, tag]
    description_en: Must pass before a release can publish.
    description_ko: release 게시 전에 반드시 통과해야 함
  preview:
    release_blocking: false
    events: [workflow_dispatch]
    description_en: Opt-in validation for a proposed client or runtime version.
    description_ko: 제안한 client 또는 runtime version의 선택 실행 검증
  nightly:
    release_blocking: false
    events: [schedule, workflow_dispatch]
    description_en: Scheduled evidence for expensive or exploratory combinations.
    description_ko: 비용이 크거나 탐색적인 조합의 정기 검증

acceptance:
  summary_en: Release acceptance is limited to the exact clients, runtimes, operations, and scenarios collected from annotated tests; it is not a claim of complete AWS Glue or EMR compatibility.
  summary_ko: Release 수용 범위는 주석 테스트에서 수집한 정확한 client, runtime, operation, scenario로 제한하며 AWS Glue 또는 EMR 전체 호환성을 의미하지 않습니다.
  areas:
    glue-control-plane-errors:
      title_en: Glue Catalog API and deterministic errors
      title_ko: Glue Catalog API와 결정적 오류
      claim_en: Every annotated Glue Catalog operation crosses the service boundary, the public Proxy path is exercised, and the documented local error catalog stays exhaustive and ordered.
      claim_ko: 주석으로 선언한 모든 Glue Catalog operation이 service boundary를 통과하고 공개 Proxy 경로를 검증하며, 문서화한 로컬 오류 catalog의 전체성과 순서를 유지합니다.
      case_ids: [boto3-botocore-1.43.66-contract, boto3-botocore-1.43.66-public-proxy]
      scenario_ids: [glue-data-catalog, modeled-service-errors, glue-operations-through-public-proxy]
      evidence_paths: [contracts/api-coverage.generated.json, contracts/glue-error-conditions.yaml, docs/compatibility/api-coverage.generated.md, docs/compatibility/glue-errors.generated.md]
      official_sources: [botocore-models]
    aws-sdk-pandas:
      title_en: AWS SDK for pandas Glue/S3 round trip
      title_ko: AWS SDK for pandas Glue/S3 왕복
      claim_en: The annotated AWS SDK for pandas profile writes and reads partitioned Parquet while registering and querying Glue database, table, partition, and S3 metadata through the public Proxy.
      claim_ko: 주석으로 선언한 AWS SDK for pandas profile이 공개 Proxy를 통해 partitioned Parquet을 쓰고 읽으며 Glue database, table, partition과 S3 metadata를 등록하고 조회합니다.
      case_ids: [awswrangler-3.17.0-glue-s3]
      scenario_ids: [parquet-glue-s3-round-trip]
      evidence_paths: [tests/e2e/test_awswrangler.py, docs/compatibility/client-matrix.md]
      official_sources: [aws-sdk-pandas]
    spark-hive:
      title_en: Spark Hive catalog behavior
      title_ko: Spark Hive catalog 동작
      claim_en: The annotated Glue 5 Spark Hive client covers complex types, typed partition pruning, partition DDL and repair, and the supported ALTER TABLE metadata variants.
      claim_ko: 주석으로 선언한 Glue 5 Spark Hive client로 complex type, type 기반 partition pruning, partition DDL과 repair, 지원하는 ALTER TABLE metadata 변형을 검증합니다.
      case_ids: [glue-5.0-spark-3.5.4-hive-iceberg-1.7.1]
      scenario_ids: [hive-complex-types, hive-partition-pruning, hive-partition-ddl-repair, hive-table-alter]
      evidence_paths: [tests/e2e/test_glue_spark_catalog.py, docs/protocols/glue-partition-expressions.md, docs/protocols/glue-hive-partition-ddl.md, docs/protocols/glue-hive-table-alter.md]
      official_sources: [glue-5.0, glue-hive]
    iceberg:
      title_en: Iceberg Java GlueCatalog lifecycle
      title_ko: Iceberg Java GlueCatalog lifecycle
      claim_en: The annotated Glue 5 profile covers Open Table Format input, create/read/write/evolution, row-level DML, snapshots and refs, maintenance procedures, managed optimizers, rename/drop/purge, and concurrent commit retry.
      claim_ko: 주석으로 선언한 Glue 5 profile에서 Open Table Format input, create/read/write/evolution, row-level DML, snapshot과 ref, maintenance procedure, managed optimizer, rename/drop/purge, concurrent commit retry를 검증합니다.
      case_ids: [glue-5.0-spark-3.5.4-hive-iceberg-1.7.1]
      scenario_ids: [iceberg-open-table-format-input, iceberg-create-append-read-evolve, iceberg-partition-schema-sort-evolution, iceberg-row-level-dml, iceberg-snapshots-refs-procedures, iceberg-managed-table-optimizers, iceberg-rename-drop-purge, iceberg-multi-container-contention]
      evidence_paths: [tests/e2e/test_glue_spark_catalog.py, docs/protocols/glue-open-table-format.md, docs/protocols/glue-iceberg-evolution.md, docs/protocols/glue-iceberg-row-level-dml.md, docs/protocols/glue-iceberg-snapshots-refs-procedures.md, docs/protocols/glue-table-optimizers.md, docs/protocols/glue-iceberg-lifecycle.md, docs/protocols/glue-iceberg-commits.md]
      official_sources: [glue-5.0, glue-iceberg, glue-open-table-format, glue-table-optimizers, iceberg-evolution, iceberg-spark-writes, iceberg-configuration, iceberg-spark-queries, iceberg-spark-ddl, iceberg-spark-procedures, iceberg-branching, iceberg-glue-catalog-source]
    emr-pyspark-s3:
      title_en: EMR PySpark and LocalStack S3 regression
      title_ko: EMR PySpark와 LocalStack S3 회귀
      claim_en: boto3 creates and controls the emulated EMR cluster while bootstrap actions, S3 artifact download, local PySpark execution, cancellation, lifecycle, and log publication remain functional.
      claim_ko: boto3로 emulated EMR cluster를 생성하고 제어하며 bootstrap action, S3 artifact download, local PySpark 실행, 취소, lifecycle, log 게시가 계속 동작함을 검증합니다.
      case_ids: [boto3-botocore-1.43.66-contract, emr-7.8.0-spark-3.5.4]
      scenario_ids: [emr-control-plane, bootstrap-s3-spark-step-lifecycle]
      evidence_paths: [emr/tests/test_boto3_contract.py, tests/e2e/test_emr_spark.py, docs/protocols/emr-log-layout.md, docs/testing.md]
      official_sources: [botocore-models, emr-7.8.0]
  exclusions:
    glue-compute:
      title_en: Glue compute services
      title_ko: Glue compute service
      reason_en: Jobs, JobRuns, Crawlers, and their client paths are outside this catalog-store release.
      reason_ko: Job, JobRun, Crawler와 이를 사용하는 client 경로는 이번 catalog-store release 범위 밖입니다.
      official_sources: [glue-5.0]
    security-and-cloud-boundaries:
      title_en: Security and cloud account boundaries
      title_ko: 보안과 cloud account 경계
      reason_en: Authentication, authorization, IAM, Lake Formation, cross-account, and cross-Region semantics are not emulated.
      reason_ko: 인증, 인가, IAM, Lake Formation, cross-account, cross-Region 의미론은 emulation하지 않습니다.
      official_sources: [glue-iceberg]
    additional-catalog-clients:
      title_en: Additional catalog clients
      title_ko: 추가 catalog client
      reason_en: PyIceberg, Flink, Trino, and the Glue Iceberg REST endpoint have no compatibility claim.
      reason_ko: PyIceberg, Flink, Trino, Glue Iceberg REST endpoint는 호환성을 보장하지 않습니다.
      official_sources: [glue-iceberg]
    external-fidelity:
      title_en: External AWS and distributed runtime fidelity
      title_ko: 외부 AWS와 분산 runtime 재현도
      reason_en: Real-AWS differential tests and physical EC2, YARN, or HDFS distribution are excluded.
      reason_ko: 실 AWS 비교 시험과 물리 EC2, YARN, HDFS 분산 환경 재현은 제외합니다.
      official_sources: [emr-7.8.0]

# The only operation classifications not provable by implementation inventory and annotated tests.
not_planned_operation_families:
  glue: [Job, JobRun, Crawler]
