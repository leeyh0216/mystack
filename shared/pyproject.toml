[project]
name = "mystack-aws-protocol"
version = "0.1.0"
description = "AWS JSON protocol primitives for Mystack"
requires-python = ">=3.11,<3.13"
dependencies = [
  "botocore==1.43.66",
  "fastapi>=0.116,<1",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"
