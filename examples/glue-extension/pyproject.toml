# Entry-point metadata follows the PyPA specification:
# https://packaging.python.org/en/latest/specifications/entry-points/
[project]
name = "mystack-glue-extension-example"
version = "0.1.0"
description = "Example providers for all three Mystack Glue extension SPIs"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.entry-points."mystack.glue.extensions.stable.v1"]
example-stable = "mystack_glue_extension_example:stable_provider"

[project.entry-points."mystack.glue.extensions.application.v1"]
example-application = "mystack_glue_extension_example:application_provider"

[project.entry-points."mystack.glue.extensions.unsafe.v1"]
example-unsafe = "mystack_glue_extension_example:unsafe_provider"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"
