[project]
name = "mystack-proxy"
version = "0.1.2"
description = "Transparent AWS routing proxy for Mystack"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<0.29",
  "mystack-aws-protocol",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
mystack-proxy = "mystack.proxy.main:run"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Namespace package configuration:
# https://docs.astral.sh/uv/concepts/build-backend/#namespace-packages
module-name = "mystack.proxy"

[tool.uv.sources]
mystack-aws-protocol = { workspace = true }
