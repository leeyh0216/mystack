runner_adapters:
  pytest-contract:
    kind: pytest
    command_prefix: [uv, run, pytest]
    timeout_config_path: tests.contract_timeout_seconds
    allowed_runtime_kinds: [python]
    source: pytest
  docker-e2e:
    kind: docker-pytest
    command_prefix: [uv, run, pytest]
    timeout_config_path: tests.e2e_timeout_seconds
    allowed_runtime_kinds: [emr, glue]
    source: docker-compose

compatibility_profiles:
  boto3-control-plane:
    client: boto3
    versions:
      boto3: 1.43.66
      botocore: 1.43.66
    services: [emr, glue]
    runtime_kinds: [python, emr, glue]
    capabilities: [aws-json-1.1, sigv4, modeled-errors, pagination]
    model_fingerprints:
      emr: 119ae1739d00d3e9361fa7e24d2e766e8f78e3c5f52c9b6b82c3ed271bafc2ad
      glue: b2a63983f6537c78842bab0bb8764922ecb54ea57d5b8606c0bac0ea0d50ac1d
    operation_ids:
      emr: [AddJobFlowSteps, AddTags, CancelSteps, DescribeCluster, DescribeStep, ListBootstrapActions, ListClusters, ListSteps, RemoveTags, RunJobFlow, SetTerminationProtection, SetVisibleToAllUsers, TerminateJobFlows]
      glue: [BatchCreatePartition, BatchDeletePartition, BatchGetPartition, BatchUpdatePartition, CreateDatabase, CreatePartition, CreateTable, DeleteDatabase, DeletePartition, DeleteTable, GetCatalogImportStatus, GetDatabase, GetDatabases, GetPartition, GetPartitions, GetTable, GetTables, GetTableVersion, GetTableVersions, UpdateDatabase, UpdatePartition, UpdateTable]
    official_sources: [botocore-models]
  awswrangler-glue-s3:
    client: awswrangler
    versions:
      awswrangler: 3.17.0
      boto3: 1.43.66
      botocore: 1.43.66
    services: [glue, s3]
    runtime_kinds: [glue]
    capabilities: [parquet-round-trip, database, table, partition, s3-head]
    model_fingerprints:
      glue: b2a63983f6537c78842bab0bb8764922ecb54ea57d5b8606c0bac0ea0d50ac1d
    operation_ids:
      glue: [CreateDatabase, CreatePartition, CreateTable, GetDatabase, GetPartition, GetTable]
    official_sources: [aws-sdk-pandas, botocore-models]
  emr-local-spark:
    client: boto3-and-spark-submit
    versions:
      emr: 7.8.0
      spark: 3.5.4
      boto3: 1.43.66
    services: [emr, s3]
    runtime_kinds: [emr]
    capabilities: [bootstrap-action, s3-artifact-download, local-spark-step, step-lifecycle]
    model_fingerprints:
      emr: 119ae1739d00d3e9361fa7e24d2e766e8f78e3c5f52c9b6b82c3ed271bafc2ad
    operation_ids:
      emr: [AddJobFlowSteps, DescribeCluster, DescribeStep, RunJobFlow, TerminateJobFlows]
    official_sources: [emr-7.8.0, botocore-models]
  glue-spark-hive-iceberg:
    client: spark-glue-catalog
    versions:
      glue: "5.0"
      spark: 3.5.4
      iceberg: 1.7.1
    services: [glue, s3]
    runtime_kinds: [glue]
    capabilities: [hive-metastore, complex-glue-types, partition-pruning, partition-ddl, partition-repair, table-alter, iceberg-glue-catalog, schema-evolution, iceberg-hidden-partitioning, iceberg-partition-evolution, iceberg-sort-evolution, iceberg-identifier-fields, iceberg-row-level-dml, iceberg-dynamic-overwrite, iceberg-copy-on-write, iceberg-merge-on-read, iceberg-concurrent-commit-retry, iceberg-time-travel, iceberg-branches-tags, iceberg-metadata-tables, iceberg-snapshot-procedures, iceberg-maintenance-procedures, iceberg-orphan-s3-cleanup, iceberg-rename, iceberg-catalog-drop, iceberg-purge]
    model_fingerprints:
      glue: b2a63983f6537c78842bab0bb8764922ecb54ea57d5b8606c0bac0ea0d50ac1d
    operation_ids:
      glue: [CreateDatabase, CreateTable, GetDatabase, GetTable, UpdateTable]
    official_sources: [glue-5.0, glue-hive, glue-iceberg, iceberg-evolution, iceberg-spark-writes, iceberg-configuration, iceberg-spark-queries, iceberg-spark-ddl, iceberg-spark-procedures, iceberg-branching, iceberg-glue-catalog-source]

scenario_sets:
  boto3-contracts:
    kind: contract
    test_nodes:
      - emr/tests/test_boto3_contract.py::test_boto3_cluster_step_and_control_operations
      - emr/tests/test_boto3_contract.py::test_boto3_cancel_steps
      - emr/tests/test_boto3_contract.py::test_boto3_receives_documented_invalid_request
      - glue/tests/test_boto3_contract.py::test_all_implemented_glue_operations_through_service_boundary
      - glue/tests/test_boto3_contract.py::test_management_read_model_lists_catalog_tree
      - glue/tests/test_boto3_contract.py::test_get_partitions_combines_typed_expression_paging_and_segments
      - glue/tests/test_hive_partition_ddl_contract.py::test_hive_partition_ddl_operation_sequence_is_deterministic
      - glue/tests/test_hive_table_alter_contract.py::test_hive_table_alter_preserves_metadata_versions_and_partitions
    scenario_ids: [emr-control-plane, glue-data-catalog, modeled-service-errors]
  boto3-public-proxy:
    kind: e2e
    test_nodes: [tests/e2e/test_public_proxy_contracts.py]
    scenario_ids: [glue-operations-through-public-proxy]
  awswrangler-round-trip:
    kind: e2e
    test_nodes: [tests/e2e/test_awswrangler.py]
    scenario_ids: [parquet-glue-s3-round-trip]
  emr-real-spark:
    kind: e2e
    test_nodes: [tests/e2e/test_emr_spark.py]
    scenario_ids: [bootstrap-s3-spark-step-lifecycle]
  glue-real-spark-catalogs:
    kind: e2e
    test_nodes: [tests/e2e/test_glue_spark_catalog.py]
    scenario_ids: [hive-complex-types, hive-partition-pruning, hive-partition-ddl-repair, hive-table-alter, iceberg-create-append-read-evolve, iceberg-partition-schema-sort-evolution, iceberg-row-level-dml, iceberg-snapshots-refs-procedures, iceberg-rename-drop-purge, iceberg-multi-container-contention]

lanes:
  required:
    release_blocking: true
    events: [pull_request, push, tag]
    description_en: Must pass before a release can publish.
    description_ko: release 게시 전에 반드시 통과해야 함
  preview:
    release_blocking: false
    events: [workflow_dispatch]
    description_en: Opt-in validation for a proposed client or runtime version.
    description_ko: 제안한 client 또는 runtime version의 선택 실행 검증
  nightly:
    release_blocking: false
    events: [schedule, workflow_dispatch]
    description_en: Scheduled evidence for expensive or exploratory combinations.
    description_ko: 비용이 크거나 탐색적인 조합의 정기 검증

cases:
  - id: boto3-botocore-1.43.66-contract
    title_en: boto3 and botocore control-plane contracts
    title_ko: boto3와 botocore control plane 계약
    lane: required
    runtime_profile: python-3.11
    runner_adapter: pytest-contract
    compatibility_profiles: [boto3-control-plane]
    scenario_set: boto3-contracts
    artifacts: [boto3-1.43.66, botocore-1.43.66]
    expected_duration_minutes: 15
  - id: boto3-botocore-1.43.66-public-proxy
    title_en: boto3 Glue operations through the public Proxy
    title_ko: 공개 Proxy를 통과하는 boto3 Glue operation
    lane: required
    runtime_profile: glue-5.0-spark-3.5.4
    runner_adapter: docker-e2e
    compatibility_profiles: [boto3-control-plane]
    scenario_set: boto3-public-proxy
    artifacts: [boto3-1.43.66, botocore-1.43.66, glue-libs-5]
    expected_duration_minutes: 60
  - id: awswrangler-3.17.0-glue-s3
    title_en: AWS SDK for pandas Glue and S3 round trip
    title_ko: AWS SDK for pandas Glue와 S3 왕복
    lane: required
    runtime_profile: glue-5.0-spark-3.5.4
    runner_adapter: docker-e2e
    compatibility_profiles: [awswrangler-glue-s3]
    scenario_set: awswrangler-round-trip
    artifacts: [awswrangler-3.17.0, boto3-1.43.66, botocore-1.43.66, glue-libs-5]
    expected_duration_minutes: 60
  - id: emr-7.8.0-spark-3.5.4
    title_en: EMR bootstrap and real local Spark step
    title_ko: EMR bootstrap과 실제 local Spark step
    lane: required
    runtime_profile: emr-7.8.0-spark-3.5.4
    runner_adapter: docker-e2e
    compatibility_profiles: [boto3-control-plane, emr-local-spark]
    scenario_set: emr-real-spark
    artifacts: [boto3-1.43.66, botocore-1.43.66, amazon-linux-2023, spark-3.5.4-hadoop3]
    expected_duration_minutes: 60
  - id: glue-5.0-spark-3.5.4-hive-iceberg-1.7.1
    title_en: Glue Spark Hive and Iceberg catalogs
    title_ko: Glue Spark Hive와 Iceberg catalog
    lane: required
    runtime_profile: glue-5.0-spark-3.5.4
    runner_adapter: docker-e2e
    compatibility_profiles: [boto3-control-plane, glue-spark-hive-iceberg]
    scenario_set: glue-real-spark-catalogs
    artifacts: [boto3-1.43.66, botocore-1.43.66, glue-libs-5]
    expected_duration_minutes: 60
