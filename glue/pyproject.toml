[project]
name = "mystack-glue"
version = "0.1.0"
description = "Protocol-compatible AWS Glue Data Catalog emulator for Mystack"
requires-python = ">=3.11,<3.13"
dependencies = [
  "antlr4-python3-runtime==4.13.2",
  "boto3==1.43.66",
  "fastapi>=0.116,<1",
  "mystack-aws-protocol",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
mystack-glue = "mystack.glue.main:run"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Namespace package configuration:
# https://docs.astral.sh/uv/concepts/build-backend/#namespace-packages
module-name = "mystack.glue"

[tool.uv.sources]
mystack-aws-protocol = { workspace = true }
